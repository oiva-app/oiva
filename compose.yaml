name: oiva-experiment1

services:
  # https://opentelemetry.io/docs/collector/install/docker/
  otel-collector:
    image: otel/opentelemetry-collector
    env_file: .env
    volumes:
      - ./src/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension

  postgres:
    image: postgres:17-alpine
    container_name: oiva-postgres
    restart: unless-stopped
    # Dev password committed intentionally — Postgres listens on localhost
    # only. Production credentials never live here; they come from a secret
    # manager (or RDS IAM auth) when AWS deployment lands.
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oiva}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-oiva_dev}
      POSTGRES_DB: ${POSTGRES_DB:-oiva}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - oiva_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  oiva_pgdata:
