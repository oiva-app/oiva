name: oiva-experiment1

services:
  
  # https://opentelemetry.io/docs/collector/install/docker/
  otel-collector:
    image: otel/opentelemetry-collector
    env_file: .env
    volumes:
      - ./src/otel-collector/otel-collector-config.yaml:/etc/otelcol/config.yaml
    ports:
      - 1888:1888 # pprof extension
      - 8888:8888 # Prometheus metrics exposed by the Collector
      - 8889:8889 # Prometheus exporter metrics
      - 13133:13133 # health_check extension
      - 4317:4317 # OTLP gRPC receiver
      - 4318:4318 # OTLP http receiver
      - 55679:55679 # zpages extension
  phoenix:
    image: arizephoenix/phoenix:latest
    ports:
      - "6006:6006"  # UI and OTLP HTTP collector
      - "4317:4317"  # OTLP gRPC collector
    environment:
      - PHOENIX_SQL_DATABASE_URL=postgresql://postgres:postgres@db:5435/postgres

  phoenix_db:
    image: postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=postgres
    ports:
      - 5435:5432
    volumes:
      - phoenix_data:/var/lib/postgresql/data

volumes:
  phoenix_data:
    driver: local
